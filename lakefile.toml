name = "AEC"
version = "0.1.0"
keywords = ["model-theory", "aec", "lean4"]
defaultTargets = ["AEC"]

# Public declarations in these modules mention definitions imported from mathlib.
moreLeanArgs = [
  "-Dbackward.privateInPublic=true",
  "-Dbackward.privateInPublic.warn=false",
]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = true
# Style noise (unused args / haveI / simpa); keep real failures and deprecations visible.
linter.unusedVariables = false
linter.unusedSimpArgs = false
linter.unnecessarySimpa = false
linter.unusedTactic = false
linter.unreachableTactic = false
linter.unnecessarySeqFocus = false
linter.unusedSectionVars = false
linter.style.haveILetI = false
linter.defProp = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "AEC"
